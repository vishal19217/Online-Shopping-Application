spring.application.name=order-service

# Datasource is provided at runtime by the Testcontainers MySQL container
# (@ServiceConnection), so no url/username/password is configured here.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Migrations live under a non-default location in this project, so let
# Hibernate build the schema for tests instead of Flyway.
spring.flyway.enabled=false
